name = "rinovabd-worker"
main = "src/index.ts"
compatibility_date = "2026-08-24"
workers_dev = true

[vars]
SHOP_NAME = "Rinova BD"
SHOP_PHONE = "+880 1738-745949"
AI_MODEL = "@cf/openai/gpt-oss-20b"
WHATSAPP_NUMBER = "8801738745949"
SHOP_ADDRESS = "Rajshahi Malopara Police Fhari, Rajshahi, Bangladesh - 6100"

[[d1_databases]]
binding = "DB"
database_name = "rinovabd-db"
database_id = "300aea86-ac31-46b9-aec4-2314f1a78b01"
migrations_dir = "migrations"

# Enable R2 in the Cloudflare Dashboard, create the bucket named rinovabd-product-images,
# then uncomment this binding before deploying direct product uploads.
# [[r2_buckets]]
# binding = "PRODUCT_IMAGES"
# bucket_name = "rinovabd-product-images"
# Local storefront assets remain functional until the optional binding is active.

[[kv_namespaces]]
binding = "CACHE"
id = "6386fcba4d63483c9766bef527a65593"

[ai]
binding = "AI"

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = ["/products/*", "/product.html", "/sitemap.xml"]
not_found_handling = "single-page-application"

[observability]
enabled = true

