name: Rinova BD Doctor

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Public Worker URL to probe'
        required: false
        default: 'https://rinovabd-worker.abdussalam8480.workers.dev'
        type: string
      strict:
        description: 'Fail the job when a required diagnostic is FAIL (default keeps the full report visible)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rinova-doctor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  doctor:
    name: Read-only project and production diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url }}
      DOCTOR_STRICT: ${{ inputs.strict }}
      DOCTOR_REPORT_DIR: Doctor-report/runs/run-${{ github.run_number }}-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUD_FLARE_API: ${{ secrets.CLOUD_FLARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '46bf056399139631a967566fdb0413fa' }}
      CLOUD_FLARE_ACCOUNT_ID: ${{ vars.CLOUD_FLARE_ACCOUNT_ID || '46bf056399139631a967566fdb0413fa' }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY }}
      STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY }}
      STEADFAST_WEBHOOK_TOKEN: ${{ secrets.STEADFAST_WEBHOOK_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only doctor
        run: node scripts/rinova-doctor.mjs

      - name: Upload redacted doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rinova-doctor-report-${{ github.run_number }}
          path: Doctor-report/runs/run-${{ github.run_number }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

# The diagnostic script writes a redacted table to GITHUB_STEP_SUMMARY.
