name: Rinova BD GitHub Pages\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\nconcurrency:\n  group: rinova-pages-${{ github.ref }}\n  cancel-in-progress: true\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\njobs:\n  deploy:\n    name: Publish static frontend to GitHub Pages\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Configure Pages\n        uses: actions/configure-pages@v5\n      - name: Upload static frontend\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./web\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n