name: Cloudflare doctor

# Run this by hand whenever a deploy fails with a Cloudflare permission error.
# It probes every capability the deploy needs and prints the exact dashboard
# change for each failure, so the token is repaired in one visit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Check the account and token
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUD_FLARE_API }}
      CLOUDFLARE_ACCOUNT_ID: 46bf056399139631a967566fdb0413fa
      CLOUDFLARE_WORKER_NAME: rinovabd-worker
      API_DOMAIN: ${{ vars.API_DOMAIN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cf-doctor.mjs
