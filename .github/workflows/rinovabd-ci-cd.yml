name: Rinova BD CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rinovabd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront and typecheck Worker
        run: pnpm build

  deploy:
    name: Deploy Worker and storefront assets
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare deployment secrets
        id: deploy-gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 46bf056399139631a967566fdb0413fa
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: repository secrets are not configured."
          fi

      - name: Deploy through Wrangler
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 46bf056399139631a967566fdb0413fa
          workingDirectory: worker
          command: deploy

      - name: Sync optional Worker runtime secrets
        if: steps.deploy-gate.outputs.enabled == 'true'
        working-directory: worker
        env:
          STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY }}
          STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY }}
          STEADFAST_WEBHOOK_TOKEN: ${{ secrets.STEADFAST_WEBHOOK_TOKEN }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --config wrangler.toml
            fi
          }
          sync_secret STEADFAST_API_KEY "$STEADFAST_API_KEY"
          sync_secret STEADFAST_SECRET_KEY "$STEADFAST_SECRET_KEY"
          sync_secret STEADFAST_WEBHOOK_TOKEN "$STEADFAST_WEBHOOK_TOKEN"
          sync_secret ADMIN_API_TOKEN "$ADMIN_API_TOKEN"
