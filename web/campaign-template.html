acing:.02em}.campaign-price del{margin-left:6px;color:#a98d99;font-weight:400}.campaign-products{padding-top:32px}.campaign-section-label{font:700 11px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8b6876}.campaign-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}.campaign-product{background:rgba(255,255,255,.78);border:1px solid #eedbe1;border-radius:18px;padding:10px;box-shadow:0 9px 25px #7a3b4c0c}.campaign-product-image{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#f4e4e8}.campaign-product-image img{width:100%;height:100%;object-fit:cover;display:block}.campaign-product h3{font:700 15px/1.25 'Playfair Display',Georgia,serif;margin:12px 4px 5px}.campaign-price{margin:0 4px 9px;color:#8a445e;font-weight:700}.campaign-price del{color:#b09aa4;font-weight:500;margin-left:4px}.campaign-price-off{display:inline-block;background:#f6e2ec;color:#8a445e;border-radius:999px;padding:2px 8px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;margin-left:4px}.campaign-product a{display:block;text-decoration:none;color:inherit}.campaign-footer{text-align:center;padding-top:44px;color:#876f77;font-size:12px}.campaign-footer a{color:#812747}.campaign-empty{padding:35px 0;color:#876f77}@media(max-width:760px){.campaign-wrap{width:min(100% - 24px,600px);padding-top:18px}.campaign-hero{grid-template-columns:1fr;gap:26px;padding:36px 0 24px}.campaign-copy{order:1}.campaign-image{order:0;border-radius:22px}.campaign-title{font-size:clamp(42px,13vw,64px)}.campaign-description{font-size:16px}.campaign-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.campaign-top{align-items:flex-start}.campaign-back{font-size:11px}}</style></head><body class="campaign-page"><script src="/runtime-config.js"></script><main class="campaign-wrap"><div class="campaign-top"><div class="campaign-brand">Rinova BD<span>Beauty, thoughtfully chosen</span></div><a class="campaign-back" href="/#shop">Browse full store ↗</a></div><section id="campaign-hero" class="campaign-hero"></section><section id="campaign-products" class="campaign-products" aria-labelledby="campaign-products-title"><div class="campaign-section-label" id="campaign-products-title">Featured in this edit</div><div id="campaign-product-grid" class="campaign-grid"></div></section><footer class="campaign-footer">A focused Rinova BD campaign experience · <a href="/">Return to store</a></footer></main><script id="campaign-data" type="application/json"></script><script src="/campaign.js"></script></body></html>
