<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rinova BD · Invoice</title><link rel="stylesheet" href="/styles.css"><style>.invoice{max-width:780px;margin:0 auto;padding:35px 20px 65px}.invoice-actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:18px}.invoice-paper{background:#fff;border:1px solid var(--line);padding:35px;box-shadow:var(--shadow)}.invoice-head{display:flex;justify-content:space-between;gap:30px;border-bottom:2px solid var(--ink);padding-bottom:20px}.invoice h1,.invoice h2{font-family:'Playfair Display',serif}.invoice h1{font-size:44px;margin:0}.invoice h2{font-size:22px}.invoice-meta{text-align:right;font-size:12px;color:var(--muted)}.bill-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0;font-size:13px}.bill-grid p{margin:4px 0}.invoice table{min-width:0;width:100%;border-collapse:collapse}.invoice th,.invoice td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.invoice th{font-size:10px;text-transform:uppercase;color:var(--muted)}.invoice-total{margin-left:auto;width:min(300px,100%);margin-top:18px}.invoice-total div{display:flex;justify-content:space-between;padding:7px 0}.invoice-total .grand{border-top:2px solid var(--ink);font-size:16px;font-weight:700}.print-note{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}@media print{.invoice-actions,.print-note{display:none}.invoice{padding:0}.invoice-paper{border:0;box-shadow:none}}
</style></head><body><main class="invoice"><div class="invoice-actions"><a class="button" href="/">← Store</a><button class="button button-dark" onclick="window.print()">Print invoice</button></div><div id="invoice-root" class="invoice-paper"><p class="muted">Loading invoice…</p></div><p class="print-note">Rinova BD · Thank you for choosing thoughtful beauty.</p></main><script src="/invoice.js"></script></body></html>
