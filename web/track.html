<div class="announcement">Rinova BD · Order tracking</div><main class="section-wrap" style="padding:72px 0;max-width:680px"><a class="text-link" href="/">← Back to Rinova</a><p class="eyebrow" style="margin-top:55px">YOUR RITUAL, ON ITS WAY</p><h1 style="font-family:'Playfair Display',serif;font-size:clamp(48px,8vw,78px);line-height:.95;letter-spacing:-.06em;margin:0 0 20px">Track your<br><em style="color:var(--accent);font-weight:500">Rinova order.</em></h1><p style="color:var(--muted);max-width:470px;line-height:1.8">Enter your Order ID, Invoice Number or mobile number to see the latest status available from our courier workflow.</p><form id="tracking-form" style="display:grid;gap:14px;margin-top:32px"><label style="font-size:11px;letter-spacing:.12em;text-transform:uppercase">Order ID <input id="order-id" placeholder="e.g. RNV-ABC123" style="display:block;width:100%;padding:16px;border:1px solid var(--line);background:white;margin-top:8px;font:inherit" /></label><label style="font-size:11px;letter-spacing:.12em;text-transform:uppercase">Invoice Number <input id="invoice-number" placeholder="e.g. RNV-INV-ABC123" style="display:block;width:100%;padding:16px;border:1px solid var(--line);background:white;margin-top:8px;font:inherit" /></label><div style="text-align:center;color:var(--muted);font-size:12px">or</div><label style="font-size:11px;letter-spacing:.12em;text-transform:uppercase">Mobile number <input id="phone" placeholder="01XXXXXXXXX" style="display:block;width:100%;padding:16px;border:1px solid var(--line);background:white;margin-top:8px;font:inherit" /></label><button class="button button-dark" type="submit" style="margin-top:8px">Check status <span>→</span></button></form><div id="result" style="margin-top:30px"></div></main><script>const form=document.getElementById('tracking-form');const result=document.getElementById('result');const params=new URLSearchParams(window.location.search);document.getElementById('order-id').value=params.get('orderId')||'';document.getElementById('invoice-number').value=params.get('invoiceNumber')||'';form.addEventListener('submit',async(e)=>{e.preventDefault();const orderId=document.getElementById('order-id').value.trim(),invoiceNumber=document.getElementById('invoice-number').value.trim(),phone=document.getElementById('phone').value.trim();if(!orderId&&!invoiceNumber&&!phone){result.innerHTML='<p style="color:var(--accent)">Please provide an Order ID, Invoice Number or mobile number.</p>';return}result.innerHTML='<p style="color:var(--muted)">Checking the latest update…</p>';const qs=new URLSearchParams(orderId?{orderId}:invoiceNumber?{invoiceNumber}:{phone});try{const r=await fetch(`/api/customer-tracking?${qs}`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Order not found');const t=d.tracking;result.innerHTML=`<div style="background:var(--sage);padding:26px;border-radius:8px"><p class="eyebrow">${t.courierProvider||'RINOVA'} · ${t.trackingCode||'ORDER RECEIVED'}</p><h2 style="font-family:'Playfair Display',serif;font-size:32px;margin:0 0 12px">${t.message}</h2><p style="margin:0;font-size:13px;color:var(--muted)">Order: <strong>${t.orderCode}</strong><br>Invoice: <strong>${t.invoiceNumber||'—'}</strong><br>Status: <strong>${t.courierStatus}</strong>${t.lastUpdated?`<br>Last update: ${new Date(t.lastUpdated).toLocaleString('en-BD')}`:''}</p></div>`}catch(err){result.innerHTML=`<p style="color:var(--accent)">${err.message}</p>`}});</script><script src="/analytics.js"></script></body></html>
