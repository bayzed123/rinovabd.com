/* Order confirmation ------------------------------------------------------- */
/* .checkout-grid sets display:grid, which beat the [hidden] rule at equal specificity, so
   the order form stayed on screen after a successful order and could be submitted twice. */
#checkout-grid[hidden]{display:none!important}
.success{border:1px solid #bfe0cd;border-radius:20px;padding:30px 26px;background:linear-gradient(155deg,#f9fdfb,#e2f3ea);text-align:center;outline:0}
.success:focus-visible{box-shadow:0 0 0 4px rgba(60,150,105,.28)}
.success-mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#2f8f5b;color:#fff;font-size:30px;line-height:1}
.success h2{margin:0 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,6vw,34px);letter-spacing:-.02em;color:#1f4733}
.success-sub{margin:0 auto 22px;max-width:34em;color:#3f6553;font-size:14px;line-height:1.6}
.success-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px;padding:16px;border:1px solid #cbe5d6;border-radius:14px;background:#fff}
.success-facts>div{min-width:0}
.success-facts dt{margin:0 0 4px;color:#6b8579;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.success-facts dd{margin:0;color:#222b26;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.success-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.success-actions .button{min-height:52px;padding:0 20px;border-radius:13px}
@media(max-width:560px){.success{padding:26px 18px}.success-facts{grid-template-columns:minmax(0,1fr);gap:14px;text-align:left}.success-actions{flex-direction:column}.success-actions .button{width:100%}}

/* Coupon box ---------------------------------------------------------------- */
.coupon-box{padding:16px 26px 4px}
.coupon-box>label{display:block;margin-bottom:7px;color:#57414d;font-size:12.5px;font-weight:600}
.coupon-row{display:flex;gap:8px}
.coupon-row input{flex:1;min-width:0;min-height:48px;padding:12px 14px;border:1px solid #ddc9d3;border-radius:12px;background:#fff;font-size:15px;text-transform:uppercase}
.coupon-row input:focus{outline:0;border-color:#c0417b;box-shadow:0 0 0 3px rgba(192,65,123,.13)}
.coupon-row .button{min-height:48px;padding:0 18px;border-radius:12px;font-size:13px;white-space:nowrap}
.coupon-message{margin:8px 0 0;min-height:17px;font-size:12.5px;line-height:1.5}
.coupon-message.ok{color:#1f7a4d;font-weight:600}
.coupon-message.bad{color:#a63a3a;font-weight:600}
.summary-line.discount-line strong{color:#1f7a4d}
@media(max-width:700px){.coupon-box{padding:14px 18px 2px}}
