<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Rinova Ops · Courier console</title><link rel="stylesheet" href="/styles.css" /><style>body{background:#f3eee9}.ops{padding:50px 0 90px}.ops-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:30px}.ops-card{background:var(--paper);border:1px solid var(--line);padding:25px;border-radius:8px}.ops-card h2{font-family:'Playfair Display',serif;font-size:29px;letter-spacing:-.04em;margin:0 0 18px}.ops-form{display:grid;gap:12px}.ops-form label{font-size:11px;letter-spacing:.11em;text-transform:uppercase}.ops-form input{display:block;width:100%;border:1px solid var(--line);padding:13px;background:white;margin-top:7px;font:inherit}.ops-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.ops-actions button{flex:1;min-width:150px}.ops-result{background:var(--sage);padding:18px;margin-top:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow:auto}.risk{display:inline-block;padding:5px 9px;background:var(--blush);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.back{display:flex;justify-content:space-between;align-items:center}.logout{font-size:11px;color:var(--muted);background:transparent;border:0;text-decoration:underline;cursor:pointer}@media(max-width:760px){.ops-grid{grid-template-columns:1fr}}
</style></head><body><div class="announcement">Rinova BD · Private operations</div><main class="section-wrap ops"><div class="back"><a class="text-link" href="/">← Storefront</a><button class="logout" id="clear">Clear saved token</button></div><p class="eyebrow" style="margin-top:48px">COURIER CONTROL CENTER</p><h1 style="font-family:'Playfair Display',serif;font-size:clamp(46px,7vw,76px);line-height:.95;letter-spacing:-.06em;margin:0">Ship with<br><em style="color:var(--accent);font-weight:500">confidence.</em></h1><div class="ops-grid"><section class="ops-card"><h2>Steadfast action</h2><form class="ops-form" id="courier-form"><label>Admin API token<input type="password" id="token" placeholder="Bearer token" required /></label><label>Order code<input id="order" placeholder="RNV-ABC123" required /></label><div class="ops-actions"><button class="button button-dark" type="submit" data-action="book">Book parcel <span>→</span></button><button class="button" style="background:var(--cream)" type="button" data-action="refresh">Refresh status <span>↻</span></button></div></form><div id="courier-result" class="ops-result">Protected actions will appear here.</div></section><section class="ops-card"><h2>Customer trust</h2><form class="ops-form" id="trust-form"><label>Customer mobile<input id="customer-phone" placeholder="01XXXXXXXXX" required /></label><button class="button button-dark" type="submit">View profile <span>→</span></button></form><div id="trust-result" class="ops-result">Search a customer to review success, cancellation and recent-order history.</div></section></div></main><script src="/runtime-config.js"></script><script>const $=s=>document.querySelector(s);const token=$('#token');token.value=sessionStorage.getItem('rinova-admin-token')||'';$('#clear').onclick=()=>{sessionStorage.removeItem('rinova-admin-token');token.value='';};async function action(kind){const order=$('#order').value.trim(),auth=token.value.trim();if(!order||!auth)return alert('Admin token and order code are required.');sessionStorage.setItem('rinova-admin-token',auth);const url=kind==='book'?`/api/admin/orders/${encodeURIComponent(order)}/steadfast/book`:`/api/admin/orders/${encodeURIComponent(order)}/steadfast/status`;const response=await fetch(url,{method:kind==='book'?'POST':'GET',headers:{Authorization:`Bearer ${auth}`}});const data=await response.json();$('#courier-result').textContent=JSON.stringify(data,null,2)}$('#courier-form').addEventListener('submit',e=>{e.preventDefault();action('book')});document.querySelector('[data-action="refresh"]').onclick=()=>action('refresh');$('#trust-form').addEventListener('submit',async e=>{e.preventDefault();const phone=$('#customer-phone').value.trim();const response=await fetch(`${window.RINOVA_API_BASE}/customers/${encodeURIComponent(phone)}/trust`);const data=await response.json();const t=data.trust;$(`#trust-result').innerHTML=`<span class="risk">${t.rating}</span><br><br>Total orders: ${t.totalPlaced}<br>Success rate: ${t.successRate===null?'No history':t.successRate+'%'}<br>Cancel rate: ${t.cancelRate}%<br>Failed/returned: ${t.failedOrReturnedOrders}`});</script></body></html>
